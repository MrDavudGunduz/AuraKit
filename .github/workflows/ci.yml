name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── Environment ──────────────────────────────────────────────────────────────
env:
  # Minimum acceptable line coverage percentage.
  # The pipeline will FAIL if coverage drops below this threshold.
  COVERAGE_THRESHOLD: 80
  # Opt into Node.js 24 runtime for all JavaScript-based actions.
  # Required to suppress Node.js 20 deprecation warnings and ensure
  # forward compatibility before the June 2, 2026 enforcement date.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── macOS Native Tests ───────────────────────────────────────────────────
  test-macos:
    name: macOS · Swift ${{ matrix.swift }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 15 — Xcode 16 / Swift 6.0 (required for swiftLanguageModes: [.v6])
          - os: macos-15
            swift: "6.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SPM
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # ── Build ──────────────────────────────────────────────────────────

      - name: Build (debug)
        run: swift build -c debug

      - name: Build (release)
        run: swift build -c release

      # ── Lint ─────────────────────────────────────────────────────────

      - name: SwiftLint (standalone)
        run: |
          # Run SwiftLint as a standalone tool to catch edge cases that
          # the build-time plugin may miss (e.g., disabled targets, conditional compilation).
          swift run -c release swiftlint lint --strict --reporter github-actions 2>&1 || true

      # ── Test ───────────────────────────────────────────────────────────

      - name: Test (parallel)
        run: swift test --parallel

      - name: Test with Thread Sanitizer
        run: swift test --sanitize=thread

      - name: Test with Address Sanitizer
        run: swift test --sanitize=address

      # ── Code Coverage ─────────────────────────────────────────────────

      - name: Generate Code Coverage
        run: |
          swift test --enable-code-coverage
          PROFDATA=$(find .build -name 'default.profdata' -type f | head -1)
          TEST_BIN=$(find .build -name 'AuraKitPackageTests' -type f | head -1)
          if [ -n "$PROFDATA" ] && [ -n "$TEST_BIN" ]; then
            xcrun llvm-cov report "$TEST_BIN" -instr-profile "$PROFDATA" \
              -ignore-filename-regex='\.build|Tests' | tee coverage-report.txt
            xcrun llvm-cov export "$TEST_BIN" -instr-profile "$PROFDATA" \
              -ignore-filename-regex='\.build|Tests' -format=lcov > coverage.lcov
          fi

      - name: Enforce Coverage Threshold
        run: |
          if [ ! -f coverage-report.txt ]; then
            echo "⚠️ Coverage report not found — skipping threshold check."
            exit 0
          fi

          # Extract the total line coverage percentage from the TOTAL row
          COVERAGE=$(tail -1 coverage-report.txt | awk '{print $NF}' | tr -d '%')

          if [ -z "$COVERAGE" ]; then
            echo "⚠️ Could not parse coverage percentage — skipping threshold check."
            exit 0
          fi

          echo "📊 Line Coverage: ${COVERAGE}%"
          echo "📏 Threshold:     ${COVERAGE_THRESHOLD}%"

          # Compare as integers (bash doesn't do float comparison natively)
          COVERAGE_INT=${COVERAGE%.*}
          if [ "$COVERAGE_INT" -lt "$COVERAGE_THRESHOLD" ]; then
            echo "❌ Coverage ${COVERAGE}% is below the ${COVERAGE_THRESHOLD}% threshold."
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets the ${COVERAGE_THRESHOLD}% threshold."
          fi

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: code-coverage-${{ matrix.os }}
          path: |
            coverage-report.txt
            coverage.lcov
          retention-days: 30

      # ── Documentation ─────────────────────────────────────────────────

      - name: Generate DocC Documentation
        run: |
          swift package generate-documentation \
            --target AuraKit \
            --disable-indexing \
            --output-path .build/docs 2>&1 || true

      # ── Privacy Manifest ────────────────────────────────────────────────

      - name: Validate Privacy Manifest
        run: |
          MANIFEST="Sources/AuraKit/PrivacyInfo.xcprivacy"
          if [ ! -f "$MANIFEST" ]; then
            echo "❌ PrivacyInfo.xcprivacy not found at $MANIFEST"
            exit 1
          fi

          # Validate plist syntax
          if ! plutil -lint "$MANIFEST"; then
            echo "❌ PrivacyInfo.xcprivacy is not a valid plist."
            exit 1
          fi

          # Verify required privacy keys exist
          for KEY in NSPrivacyTracking NSPrivacyTrackingDomains NSPrivacyCollectedDataTypes NSPrivacyAccessedAPITypes; do
            if ! plutil -extract "$KEY" raw "$MANIFEST" > /dev/null 2>&1; then
              echo "❌ Required key '$KEY' missing from PrivacyInfo.xcprivacy"
              exit 1
            fi
          done

          # Verify tracking is disabled
          TRACKING=$(plutil -extract NSPrivacyTracking raw "$MANIFEST" 2>/dev/null)
          if [ "$TRACKING" != "false" ] && [ "$TRACKING" != "0" ]; then
            echo "❌ NSPrivacyTracking must be false (got: $TRACKING)"
            exit 1
          fi

          echo "✅ PrivacyInfo.xcprivacy passes all validation checks."

  # ── iOS Simulator Tests ──────────────────────────────────────────────────
  test-ios:
    name: iOS Simulator · ${{ matrix.destination }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - destination: "platform=iOS Simulator,name=iPhone 16,OS=latest"
            scheme: AuraKit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

      - name: Test on iOS Simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

  # ── visionOS Simulator Tests ───────────────────────────────────────────
  test-visionos:
    name: visionOS Simulator · Apple Vision Pro
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build for visionOS Simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -scheme AuraKit \
            -destination "platform=visionOS Simulator,name=Apple Vision Pro" \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

      - name: Test on visionOS Simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme AuraKit \
            -destination "platform=visionOS Simulator,name=Apple Vision Pro" \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty
