# docs.yml
# AuraKit — DocC Documentation Deployment
#
# Generates DocC documentation and deploys to GitHub Pages.
# Triggered on v* tag pushes and manual dispatch.

name: Deploy DocC to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Sets permissions for GITHUB_TOKEN for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      - name: Build DocC Documentation
        run: |
          swift package generate-documentation \
            --target AuraKit \
            --output-path ./docs \
            --transform-for-static-hosting \
            --hosting-base-path AuraKit

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
